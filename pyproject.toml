[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-harness"
version = "1.3.0"
description = "Trace-based evaluation for hybrid SQL + RAG agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dashboard = ["streamlit>=1.36"]
dev = ["jsonschema>=4.23", "pytest>=8.0", "ruff>=0.8"]

[project.scripts]
agenteval = "agenteval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agenteval*", "agents*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
